name: Publicidad diaria de OriginalMas

on:
  schedule:
    # Evitamos el minuto 00, cuando GitHub Actions suele acumular retrasos.
    # En verano 10:07 UTC = 12:07 Madrid; en invierno 11:07 UTC = 12:07 Madrid.
    # La segunda ejecución solo actúa si la hora local es 12, según el script.
    - cron: "7 10 * * *"
    - cron: "7 11 * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar un mensaje de prueba ahora"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publicidad-diaria-telegram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar en el tema de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || '@Info_OriginalMas' }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ vars.TELEGRAM_MESSAGE_THREAD_ID || '113' }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba && '1' || '0' }}
        run: python scripts/publicidad_diaria.py
