name: Publicidad diaria de OriginalMas

on:
  schedule:
    # 12:00 hora peninsular: 11:00 UTC en invierno y 10:00 UTC en verano.
    # El script comprueba la hora local Europe/Madrid antes de publicar.
    - cron: "0 11 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar un mensaje de prueba ahora"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publicidad-diaria-telegram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar en el tema de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || '@Info_OriginalMas' }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ vars.TELEGRAM_MESSAGE_THREAD_ID || '113' }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba && '1' || '0' }}
        run: python scripts/publicidad_diaria.py
